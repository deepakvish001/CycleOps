services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: cycleops
      POSTGRES_USER: cycleops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [cycleops-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [cycleops-nats:/data]
volumes:
  cycleops-postgres:
  cycleops-nats:
